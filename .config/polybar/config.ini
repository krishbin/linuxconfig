[colors]
 rosewater = #f5e0dc
 flamingo = #f2cdcd
 pink = #f5c2e7
 mauve = #cba6f7
 red = #f38ba8
 maroon = #eba0ac
 peach = #fab387
 yellow = #f9e2af
 green = #a6e3a1
 teal = #94e2d5
 sky = #89dceb
 sapphire = #74c7ec
 blue = #89b4fa
 lavender = #b4befe
 text = #cdd6f4
 subtext1 = #bac2de
 subtext0 = #a6adc8
 overlay2 = #9399b2
 overlay1 = #7f849c
 overlay0 = #6c7086
 surface2 = #585b70
 surface1 = #45475a
 surface0 = #313244
 base = #1e1e2e
 mantle = #181825
 crust = #11111b
 transparent = #FF00000

[bar/bottom]
bottom=true
monitor=HDMI-1-0
monitor-fallback=eDP
width = 100%
height = 32
background = ${colors.base}
foreground = ${colors.subtext0}
border-color = ${colors.crust}
spacing = 4
underline-size = 4
overline-size = 4
padding = 2
font-0 = JetBrains Mono NF:pixelsize=11:antialias=true:weight=bold;2
font-1 = Agave Nerd Font:pixelsize=11:antialias=true:weight:bold;2
modules-left = launcher xwindow
modules-center = i3
modules-right = pulseaudio cpu memory wireless-network wired-network battery day clock
tray-position = right
wm-restack = i3
enable-ipc=true

[module/cpu]
type = internal/cpu
interval = 1
label = %percentage:2%%
label-font = 1
format =  <label>
format-padding = 2

[module/memory]
type = internal/memory
interval = 3
label = %percentage_used:2%%
label-font = 1
format =  <label>
format-padding = 2

[module/launcher]
type = custom/text
click-left = rofi -show drun -show-icons
content =  
content-font = 1
content-background = ${colors.blue}
content-foreground = ${colors.mantle}
content-padding = 2
content-overline = ${colors.crust}
content-underline = ${colors.crust}

[module/i3]
type = internal/i3
format = <label-state>
label-focused = %name%
label-focused-padding = 2
label-focused-background = ${colors.base}
label-focused-foreground = ${colors.blue}
label-focused-underline = ${colors.blue}
label-focused-overline = ${colors.base}
label-occupied = %name%
label-occupied-padding = 2
label-occupied-foreground = ${colors.subtext1}
label-urgent = %name%
label-urgent-padding = 2
label-empty = %name%
label-empty-padding = 2
label-empty-foreground = ${colors.text}

[module/xwindow]
type = internal/xwindow 
label = %{A3:bspc node -c:} %title:0:48:...% %{A}
format-overline = ${colors.base}
format-underline = ${colors.base}
format-foreground = ${colors.lavender}
label-margin = 1

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max=true
format-volume = <label-volume><bar-volume>
format-volume-padding = 2
format-muted-padding = 2
label-volume =
label-volume-foreground = ${colors.base}
label-muted = ──────────
label-muted-foreground = ${colors.red}
bar-volume-width = 10
bar-volume-foreground-0 = ${colors.mauve}
bar-volume-foreground-1 = ${colors.mauve}
bar-volume-foreground-2 = ${colors.mauve}
bar-volume-foreground-3 = ${colors.mauve}
bar-volume-foreground-4 = ${colors.mauve}
bar-volume-foreground-5 = ${colors.maroon}
bar-volume-foreground-6 = ${colors.peach}
bar-volume-gradient = false
bar-volume-indicator = ━
bar-volume-indicator-foreground = ${colors.overlay1}
bar-volume-fill = ─
bar-volume-empty = ─
bar-volume-empty-foreground = ${colors.surface0}
click-right = flatpak run org.pulseaudio.pavucontrol

[module/wireless-network]
type = internal/network
format-connected = <ramp-signal>
format-connected-padding = 2
format-disconnected = <label-disconnected>
format-disconnected-padding = 2
interface = wlp3s0
interval = 4
label-disconnected = 󰤭
ramp-signal-0 = 󰤫
ramp-signal-1 = 󰤯
ramp-signal-2 = 󰤟
ramp-signal-3 = 󰤢
ramp-signal-4 = 󰤥
ramp-signal-5 = 󰤨

[module/wired-network]
type = internal/network
format-connected-foreground = ${colors.sky}
format-disconnected-foreground = ${colors.sky}
interface = eno1
interval = 4
label-connected = 󰈀
label-connected-padding = 2
label-disconnected =

[module/battery]
type = internal/battery
battery = BAT0
adapter = ACAD
low-at = 15
full-at = 98
poll-interval = 5
format-full = <label-full>
format-charging = <label-charging>
format-discharging = <label-discharging>
label-full = 󱟢
label-charging = %percentage:2%% 󰂄
label-discharging = %percentage:2%%
format-full-padding = 2
format-charging-padding = 2
format-discharging-padding = 2
format-foreground = ${colors.base}
format-background = ${colors.surface1}

[module/day]
type = internal/date
time = %a %e
format = <label>
label = %time%
label-margin = 2
format-foreground = ${colors.blue}
format-background = ${colors.surface0}
format-overline = ${colors.surface0}
format-underline = ${colors.surface0}

[module/clock]
type = internal/date
time = %H:%M
format = <label>
label = %time%
label-margin = 2
format-background = ${colors.blue}
format-foreground = ${colors.mantle}
format-overline = ${colors.blue}
format-underline = ${colors.blue}
